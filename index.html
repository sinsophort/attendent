<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ប្រព័ន្ធកត់ត្រាវត្តមាន</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      /* អនុញ្ញាតឱ្យ Scroll លើ iOS Safari បានយ៉ាងរលូន */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #eef2f5;
    }
    .iframe-container {
      width: 100%;
      min-height: 100vh;
      /* បន្ថែម Padding ខាងក្រោមខ្លះ ការពារ Safari Bottom Navigation Bar បាំង */
      padding-bottom: 60px; 
      display: block;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbzG63Vzr57lbEl4nc5xaJSJ72NezXpgryvLqDO24GyjfIfi6_R2sZKgpRMSAS5IKB_W/exec"
      allow="camera *; microphone *; geolocation *;"
      sandbox="allow-forms allow-modals allow-popups-to-escape-sandbox allow-popups allow-scripts allow-same-origin">
    </iframe>
  </div>
</body>
</html>
