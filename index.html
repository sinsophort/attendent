<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- កំណត់ឱ្យពេញអេក្រង់ដូច App ពិតៗ (PWA / Fullscreen Mobile) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attendance App">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#eef2f5">

  <title>ប្រព័ន្ធកត់ត្រាវត្តមានបុគ្គលិក / Hệ thống điểm danh nhân viên</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #eef2f5;
      font-family: 'Khmer OS Battambang', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: fixed;
      inset: 0;
    }

    /* ប្រអប់រុំ Iframe ពេញអេក្រង់ទូរស័ព្ទ និងការពារកុំឱ្យដាច់គែម (Safe Area) */
    .app-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef2f5;
    }

    /* 
      🎯 លាក់របារពណ៌ប្រផេះខាងលើរបស់ Google Apps Script ("This application was created by...")
      ដោយរុញ Iframe ឡើងលើ -40px និងបន្ថែមកម្ពស់ +40px មកវិញ ដើម្បីកុំឱ្យដាច់ផ្នែកខាងក្រោមនៃអេក្រង់
    */
    .gas-iframe {
      position: absolute;
      top: -40px;
      left: 0;
      width: 100%;
      height: calc(100% + 40px);
      border: none;
      display: block;
      background: #eef2f5;
    }

    /* ផ្ទាំង Loading មុនពេល Google Apps Script បើកចេញមក */
    .loading-screen {
      position: absolute;
      inset: 0;
      background: #eef2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #cbd5e1;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    .loading-text {
      font-size: 14px;
      font-weight: bold;
      color: #1e3a8a;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- ផ្ទាំង Loading ពេលកំពុងភ្ជាប់ទៅប្រព័ន្ធ -->
  <div class="loading-screen" id="loader">
    <div class="spinner"></div>
    <div class="loading-text">កំពុងបើកប្រព័ន្ធវត្តមាន...</div>
  </div>

  <!-- ប្រអប់បង្ហាញ Google Apps Script ពេញអេក្រង់ និងលាក់របារ Google ខាងលើ -->
  <div class="app-viewport">
    <!-- 📌 ជំនួស WEB_APP_URL របស់អ្នកនៅក្នុង src ខាងក្រោម ប្រសិនបើអ្នកមានប្ដូរ Link ថ្មី -->
    <iframe
      id="appFrame"
      class="gas-iframe"
      src="https://script.google.com/macros/s/AKfycbw0hwKSZnL1aSOgLSmCiWBqQMNWPSr0-ZqqoqNmHIHqW6fuDIpuDU05wzUUTLoaunzB/exec"
      allow="camera *; microphone *; geolocation *; clipboard-write"
      allowfullscreen="true"
      onload="hideLoader()">
    </iframe>
  </div>

  <script>
    function hideLoader() {
      var loader = document.getElementById('loader');
      if (loader) {
        setTimeout(function() {
          loader.classList.add('hidden');
        }, 300);
      }
    }

    // ការពារករណីអ៊ីនធឺណិតយឺត ឱ្យបិទផ្ទាំង Loading ក្រោយ ៥ វិនាទីដោយស្វ័យប្រវត្តិ
    setTimeout(hideLoader, 5000);
  </script>

</body>
</html>
