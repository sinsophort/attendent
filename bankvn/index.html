<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bank Record & Roster System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f1f5f9;
    }
    .iframe-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .iframe-container iframe {
      width: 100%;
      /* បន្ថយមកត្រឹម -24px ដើម្បីឱ្យឃើញស៊ុមពណ៌ខ្មៅខាងលើពេញស្អាត និងបាំងផុតអក្សរ Google */
      margin-top: -20px;
      height: calc(100vh + 24px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbyQaARb_oMSnCOcD0p6KoncHVIrKh0_cG-vmMPZYRlPjosEDgfyQ-eHOif3gdWTasAntg/exec" 
      allow="camera; microphone; clipboard-read; clipboard-write">
    </iframe>
  </div>
</body>
</html>
