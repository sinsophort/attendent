<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060b16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="52" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="228" height="228" rx="46" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Smartphone Silhouette -->
  <rect x="74" y="28" width="92" height="184" rx="18" fill="#0b1528" stroke="url(#goldGrad)" stroke-width="3.5"/>
  <rect x="80" y="36" width="80" height="168" rx="13" fill="#0f2442" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
  <rect x="104" y="33" width="32" height="4" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="102" y="196" width="36" height="3.5" rx="1.75" fill="#38bdf8" opacity="0.75"/>
  <!-- Shield Emblem -->
  <path d="M120 54 L178 78 L178 124 C178 162 152 186 120 198 C88 186 62 162 62 124 L62 78 Z" fill="#0c1930" stroke="url(#goldGrad)" stroke-width="5" filter="url(#glow)"/>
  <path d="M120 64 L168 84 L168 122 C168 154 146 175 120 186 C94 175 72 154 72 122 L72 84 Z" fill="#0f294a" stroke="url(#cyanGrad)" stroke-width="2"/>
  <!-- Inner Vault Ring -->
  <circle cx="120" cy="122" r="34" fill="#081426" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="10 5"/>
  <circle cx="120" cy="122" r="26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- GO/7 Typography -->
  <text x="98" y="132" text-anchor="middle" font-family="'Segoe UI', 'Inter', sans-serif" font-weight="900" font-size="30" fill="url(#goldGrad)" letter-spacing="0.5">GO</text>
  <path d="M126 144 L142 98" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round"/>
  <text x="155" y="132" text-anchor="middle" font-family="'Segoe UI', 'Inter', sans-serif" font-weight="900" font-size="31" fill="url(#cyanGrad)">7</text>
</svg>
