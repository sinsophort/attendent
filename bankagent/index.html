<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bank GO/7" />
  <meta name="description" content="Dash Board Report Bank GO/7 — Bank Record, Phone Inventory & Daily Roster System v3.6.9" />

  <title>Dash Board Report Bank GO/7 — v3.6.9</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* កម្ពស់បាំងរបារអក្សរ Google Apps Script ខាងលើដោយស្វ័យប្រវត្តិ (Top Warning Banner Mask Offset) */
      --gas-banner-crop: 0px;
      --top-shield-height: 0px;
      --bg-deep: #070d19;
      --bg-navy: #0f172a;
      --accent-blue: #38bdf8;
      --accent-gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-deep);
      font-family: 'Inter', 'Kantumruy Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      user-select: none;
    }

    /* ==========================================================================
       1. IFRAME VIEWPORT & GOOGLE APPS SCRIPT TOP BANNER MASKING ENGINE
       - រុញ និងកាត់ផ្តាច់របារអក្សរព្រមានខាងលើរបស់ Google Apps Script មិនឱ្យឃើញ 100%
       - បូកបន្ថែមរបារការពារខាងលើ (Top Mask Shield) សម្រាប់បាំងជិតสนិទគ្រប់ទំហំអេក្រង់
       ========================================================================== */
    .iframe-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #f1f5f9;
      z-index: 1;
    }

    /* Iframe ត្រូវបានរុញឡើងលើចំនួន --gas-banner-crop (38px) ដើម្បីលាក់របារអក្សរ Google */
    #gasAppFrame {
      position: absolute;
      top: calc(var(--gas-banner-crop) * -1);
      left: 0;
      width: 100%;
      height: calc(100% + var(--gas-banner-crop));
      border: none;
      display: block;
      background: #f1f5f9;
      transition: top 0.22s ease, height 0.22s ease;
    }

    /* របៀបបន្ថែម៖ Top Brand Shield Bar (បើអ្នកប្រើចង់ដាក់របារពណ៌ទឹកប៊ិចចាស់បាំងពីលើបន្ថែម) */
    .top-brand-shield {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--top-shield-height);
      background: linear-gradient(90deg, #070d19 0%, #0f172a 50%, #1e3a8a 100%);
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 25;
      overflow: hidden;
      transition: height 0.22s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    body.shield-bar-active {
      --top-shield-height: 38px;
      --gas-banner-crop: 0px;
    }
    body.crop-deep-mode {
      --gas-banner-crop: 46px;
      --top-shield-height: 0px;
    }
    body.crop-off-mode {
      --gas-banner-crop: 0px;
      --top-shield-height: 0px;
    }

    .shield-brand-left {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.3px;
    }
    .shield-brand-left img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: cover;
    }
    .shield-ver-pill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .shield-status-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      display: inline-block;
    }

    /* ==========================================================================
       2. FLOATING MINI CONTROL PILL (អាចបង្រួមតូចនៅมุมខាងស្តាំក្រោម)
       ========================================================================== */
    .floating-dock {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      padding: 4px 7px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: all 0.22s ease;
      opacity: 0.45;
    }
    .floating-dock:hover {
      opacity: 1;
      transform: translateY(-1px);
    }
    .floating-dock.dock-collapsed .dock-extra {
      display: none;
    }
    .dock-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .dock-btn:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #60a5fa;
    }

    /* ==========================================================================
       3. LUXURY ENTERPRISE LOADING SCREEN (#appLoaderOverlay)
       ========================================================================== */
    #appLoaderOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background:
        radial-gradient(circle at 50% 35%, rgba(30, 58, 138, 0.55) 0%, rgba(15, 23, 42, 0.92) 55%, #050914 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.55s ease, transform 0.55s ease;
    }
    #appLoaderOverlay.loader-hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.03);
      pointer-events: none;
    }

    /* Ambient Glowing Orbs */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.35;
      pointer-events: none;
    }
    .orb-1 {
      width: 320px;
      height: 320px;
      background: #2563eb;
      top: 12%;
      left: 18%;
      animation: floatOrb 6s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 280px;
      height: 280px;
      background: #f59e0b;
      bottom: 14%;
      right: 18%;
      opacity: 0.2;
      animation: floatOrb 7s ease-in-out infinite alternate-reverse;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(18px, -18px) scale(1.08); }
    }

    .loader-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 410px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 28px;
      padding: 36px 28px 30px 28px;
      text-align: center;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* Logo Stage with Dual Rotating Orbital Rings */
    .logo-stage {
      position: relative;
      width: 138px;
      height: 138px;
      margin: 0 auto 22px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orbit-ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: #38bdf8;
      border-right-color: rgba(56, 189, 248, 0.35);
      animation: spinClockwise 2.2s linear infinite;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.55));
    }
    .orbit-ring-inner {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-bottom-color: #f59e0b;
      border-left-color: rgba(245, 158, 11, 0.35);
      animation: spinCounter 2.8s linear infinite;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.45));
    }
    @keyframes spinClockwise {
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      to { transform: rotate(-360deg); }
    }

    .brand-logo-box {
      width: 98px;
      height: 98px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.6),
        0 0 0 2px rgba(245, 158, 11, 0.45);
      animation: pulseLogo 2.4s ease-in-out infinite;
      background: #0b1528;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 28px rgba(0,0,0,0.6), 0 0 0 2px rgba(245, 158, 11, 0.45); }
      50% { transform: scale(1.04); box-shadow: 0 12px 34px rgba(56, 189, 248, 0.35), 0 0 0 3px rgba(56, 189, 248, 0.65); }
    }

    .loader-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .loader-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(90deg, #ffffff 0%, #bae6fd 55%, #fde047 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .loader-subtitle {
      font-size: 12.5px;
      color: #94a3b8;
      font-weight: 500;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    /* Shimmer Progress Bar */
    .progress-track {
      width: 100%;
      height: 7px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.16);
      margin-bottom: 12px;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 15%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2563eb 0%, #38bdf8 50%, #f59e0b 100%);
      background-size: 200% 100%;
      animation: shimmerBar 1.8s linear infinite;
      transition: width 0.35s ease;
    }
    @keyframes shimmerBar {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .loader-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 600;
      color: #cbd5e1;
    }
    #loaderStepText {
      color: #93c5fd;
      text-align: left;
    }
    #loaderPercentText {
      color: #fde047;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .loader-skip-btn {
      margin-top: 18px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: all 0.15s ease;
    }
    .loader-skip-btn:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #60a5fa;
    }

    @media (max-width: 640px) {
      :root {
        /* លើទូរស័ព្ទដៃ របារព្រមាន Google អាចខ្ពស់ជាងកុំព្យូទ័របន្តិច */
        --gas-banner-crop: 0px;
      }
      .loader-card {
        padding: 30px 22px 24px 22px;
        border-radius: 24px;
      }
      .loader-title {
        font-size: 19px;
      }
    }
  </style>
</head>

  <!-- 3. FULL-SCREEN IFRAME CONTAINER (បាំងអក្សរ Google Apps Script ខាងលើដោយស្វ័យប្រវត្តិ) -->
  <main class="iframe-stage">
    <iframe
      id="gasAppFrame"
      src="https://script.google.com/macros/s/AKfycbyKXYs7eau0R1yfyHMPGbyk2DAtduRdVuT2jwxofIiGRByAffzu0tPJBr4N5kKNZgM/exec"
      title="Dash Board Report Bank GO/7 v3.6.9"
      allow="clipboard-read; clipboard-write; fullscreen; camera"
      allowfullscreen>
    </iframe>
  </main>

  <script>
    // =========================================================================
    // CONFIGURATION: តំណភ្ជាប់ Google Apps Script Web App URL (.../exec)
    // =========================================================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKXYs7eau0R1yfyHMPGbyk2DAtduRdVuT2jwxofIiGRByAffzu0tPJBr4N5kKNZgM/exec";

    const loaderOverlay = document.getElementById('appLoaderOverlay');
    const progressBar = document.getElementById('loaderProgressBar');
    const stepText = document.getElementById('loaderStepText');
    const percentText = document.getElementById('loaderPercentText');
    const manualEnterBtn = document.getElementById('btnManualEnterApp');
    const gasFrame = document.getElementById('gasAppFrame');

    let currentProgress = 15;
    let isLoaderDismissed = false;

    const LOADING_STEPS = [
      { pct: 28, text: 'Connecting to GO/7 Cloud Database...' },
      { pct: 52, text: 'Verifying Role Security & Session Token...' },
      { pct: 76, text: 'Syncing Bank Records, Phone Stock & Roster...' },
      { pct: 92, text: 'Rendering Enterprise Workspace v3.6.9...' }
    ];

    let stepIndex = 0;
    const progressInterval = setInterval(() => {
      if (isLoaderDismissed) {
        clearInterval(progressInterval);
        return;
      }
      if (stepIndex < LOADING_STEPS.length) {
        const st = LOADING_STEPS[stepIndex];
        currentProgress = st.pct;
        progressBar.style.width = currentProgress + '%';
        stepText.textContent = st.text;
        percentText.textContent = currentProgress + '%';
        stepIndex++;
      } else if (currentProgress < 96) {
        currentProgress += 1;
        progressBar.style.width = currentProgress + '%';
        percentText.textContent = currentProgress + '%';
      }
    }, 650);

    // បង្ហាញប៊ូតុងរំលង (Skip) ប្រសិនបើអ៊ីនធឺណិតយឺតលើសពី 4.5 វិនាទី
    setTimeout(() => {
      if (!isLoaderDismissed && manualEnterBtn) {
        manualEnterBtn.style.display = 'inline-block';
      }
    }, 4500);

    // លាក់ផ្ទាំង Loading ដោយស្វ័យប្រវត្តិនៅពេល Iframe ផ្ទុករួចរាល់
    function dismissLoaderNow() {
      if (isLoaderDismissed) return;
      isLoaderDismissed = true;
      clearInterval(progressInterval);
      progressBar.style.width = '100%';
      stepText.textContent = 'System Ready!';
      percentText.textContent = '100%';
      setTimeout(() => {
        loaderOverlay.classList.add('loader-hidden');
      }, 260);
    }

    gasFrame.addEventListener('load', () => {
      dismissLoaderNow();
    });

    // Fallback safety timeout (8.5 seconds max)
    setTimeout(() => {
      dismissLoaderNow();
    }, 8500);

    // Register Service Worker for PWA ("Add to Home Screen")
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
