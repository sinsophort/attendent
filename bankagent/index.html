<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta id="dynamicViewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Dash Board Report Bank GO/7 — v2.2.5</title>
  <script>
    // ស្គាល់ស្វ័យប្រវត្តិ៖ បើ Browser ទូរស័ព្ទចុច "Request Desktop Website" ឱ្យបើកទទឹង Desktop (1360px) តែបើបើកធម្មតាឱ្យបើកតាមទទឹងទូរស័ព្ទ
    (function syncViewportMode() {
      var ua = navigator.userAgent || "";
      var isMobileUA = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
      var isTouch = (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) || ("ontouchstart" in window);
      var vp = document.getElementById("dynamicViewport");
      if (vp) {
        if (!isMobileUA && isTouch) {
          vp.setAttribute("content", "width=1360, user-scalable=yes");
        } else {
          vp.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover");
        }
      }
    })();
  </script>
  <style>
    :root {
      --app-height: 100dvh;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      background-color: #f1f5f9;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
    }
    .iframe-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .iframe-container iframe {
      width: 100%;
      /* រក្សាគម្លាតបាំងផ្ទាំងខាងលើតាមទំហំដដែល (-7px) និងគណនាកម្ពស់តាមអេក្រង់ពិតប្រាកដលើ iOS Safari & Android */
      margin-top: -7px;
      height: calc(var(--app-height, 100dvh) + 7px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="iframeWrap" class="iframe-container">
    <iframe
      id="gasAppFrame"
      scrolling="yes"
      src="https://script.google.com/macros/s/AKfycbyD4L2YjM1huLdq1p1VeuR0_YT7cbAHrfaBdlQVmGMlzYs3SHTC25vCQvmoDTOcYIIBVg/exec"
      allow="camera; microphone; clipboard-read; clipboard-write">
    </iframe>
  </div>

  <script>
    // គណនាកម្ពស់អេក្រង់ពិតប្រាកដលើ iOS Safari និង Android Browser គ្រប់ពេល ដើម្បីអូសឡើងចុះបាន Smooth និងពេញល្អ ១០០%
    function updateRealMobileViewportHeight() {
      var h = (window.visualViewport && window.visualViewport.height) ? Math.round(window.visualViewport.height) : window.innerHeight;
      if (h && h > 100) {
        document.documentElement.style.setProperty("--app-height", h + "px");
        var wrap = document.getElementById("iframeWrap");
        var frame = document.getElementById("gasAppFrame");
        if (wrap) wrap.style.height = h + "px";
        if (frame) frame.style.height = (h + 7) + "px";
      }
    }
    updateRealMobileViewportHeight();
    window.addEventListener("load", updateRealMobileViewportHeight);
    window.addEventListener("resize", updateRealMobileViewportHeight);
    window.addEventListener("orientationchange", function() {
      setTimeout(updateRealMobileViewportHeight, 150);
      setTimeout(updateRealMobileViewportHeight, 400);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateRealMobileViewportHeight);
      window.visualViewport.addEventListener("scroll", updateRealMobileViewportHeight);
    }
  </script>
</body>
</html>
